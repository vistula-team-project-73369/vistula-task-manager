<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Contribution</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Team Contribution</h1>
      <p><a href="index.html">← Back to Task Manager</a></p>
    </header>

    <section class="card" style="text-align: center;">
      <p style="margin-bottom: 1.5rem;">Click the button below to load contributor information from <code>contribution.json</code>.</p>
      <button id="load-contributor" type="button" style="padding: 0.75rem 1.5rem; font-size: 1rem;">Show Contributor</button>
      
      <div style="margin-top: 1.5rem; font-size: 1.1rem; font-weight: 600;">
        Contributor Student ID: <span id="contributor-student-id" style="color: #2563eb;">(Not loaded)</span>
      </div>
    </section>
  </div>

  <script>
    document.getElementById("load-contributor").addEventListener("click", async () => {
      const displayEl = document.getElementById("contributor-student-id");
      try {
        const response = await fetch("contribution.json");
        if (!response.ok) {
          throw new Error("HTTP error " + response.status);
        }
        const data = await response.json();
        if (data && data.contributorStudentId) {
          displayEl.textContent = data.contributorStudentId;
        } else {
          displayEl.textContent = "Error: contributorStudentId missing in JSON";
        }
      } catch (err) {
        displayEl.textContent = "Failed to load: " + err.message;
      }
    });
  </script>
</body>
</html>
